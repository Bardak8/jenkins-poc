groups:
  - name: blackbox
    rules:

      - alert: ProbeFailed
        expr: probe_success{job!="blackbox-ssh"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Sonde en échec sur {{ $labels.instance }}"
          description: "La sonde {{ $labels.job }} vers {{ $labels.instance }} ({{ $labels.service }}) échoue depuis plus de 3 minutes"

      - alert: SshDaemonUnresponsive
        expr: probe_success{job="blackbox-ssh"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Démon SSH hors service sur {{ $labels.instance }}"
          description: "Le démon SSH de {{ $labels.instance }} ({{ $labels.service }}) ne renvoie plus de bannière valide depuis plus de 3 minutes"

      - alert: ProbeSlow
        expr: probe_duration_seconds > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Sonde lente sur {{ $labels.instance }}"
          description: "La sonde vers {{ $labels.instance }} met {{ $value | printf \"%.1f\" }}s à répondre depuis plus de 10 minutes"

      - alert: HttpStatusUnexpected
        expr: probe_http_status_code >= 400
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Code HTTP inattendu sur {{ $labels.instance }}"
          description: "L'interface {{ $labels.instance }} retourne un code {{ $value }} depuis plus de 5 minutes"
