scrape_configs:
  - job_name: "pve"
    metrics_path: /pve
    params:
      module: [default]
    static_configs:
      - targets:
          - 192.168.1.3
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: pve-exporter:9221
