groups:
  - name: nodes
    rules:
      - alert: NodeDown
        expr: up{job=~".*node-exporter.*"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Nœud {{ $labels.instance }} injoignable"
          description: "Le nœud {{ $labels.instance }} ne répond plus depuis plus de 2 minutes"

      - alert: HighCPU
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CPU élevé sur {{ $labels.instance }}"
          description: "CPU à {{ $value | printf \"%.0f\" }}% sur {{ $labels.instance }} depuis plus de 10 minutes"

      - alert: HighMemory
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Mémoire élevée sur {{ $labels.instance }}"
          description: "Mémoire à {{ $value | printf \"%.0f\" }}% sur {{ $labels.instance }} depuis plus de 10 minutes"

      - alert: DiskSpaceLow
        expr: (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})) * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Espace disque faible sur {{ $labels.instance }}"
          description: "Disque {{ $labels.mountpoint }} à {{ $value | printf \"%.0f\" }}% sur {{ $labels.instance }}"
